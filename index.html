<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本旅遊 AI 隨手記帳</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Inter Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            jpRed: '#E60012',
            jpDark: '#1E293B',
            jpBg: '#F8FAFC',
          }
        }
      }
    }
  </script>
  <style>
    body {
      touch-action: manipulation;
      background-color: #F1F5F9;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="font-sans text-slate-800 pb-24 md:pb-8 max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl border-x border-slate-200">

  <!-- Header -->
  <header class="bg-gradient-to-r from-red-600 to-rose-600 text-white p-4 sticky top-0 z-30 shadow-md">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">⛩️</span>
        <div>
          <h1 class="font-bold text-lg tracking-wide leading-tight">日本旅遊記帳</h1>
          <p class="text-xs text-rose-100 flex items-center gap-1">
            <span>AI 自動辨識翻譯</span>
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          </p>
        </div>
      </div>
      <button id="btnSettings" class="p-2 rounded-full hover:bg-white/20 transition-colors relative" title="設定">
        <i class="fa-solid fa-gear text-lg"></i>
        <span id="apiKeyBadge" class="absolute top-1 right-1 w-2.5 h-2.5 bg-amber-400 rounded-full border-2 border-red-600 hidden"></span>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="p-4 space-y-4">

    <!-- Summary Cards -->
    <section class="grid grid-cols-2 gap-3">
      <!-- Total JPY -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">總消費 (JPY)</div>
        <div class="text-2xl font-black text-slate-900 tracking-tight flex items-baseline">
          <span class="text-xs font-bold text-red-500 mr-1">¥</span>
          <span id="totalJpy">0</span>
        </div>
        <div class="text-[11px] text-slate-400 mt-1 flex items-center justify-between">
          <span>今日: ¥<span id="todayJpy">0</span></span>
        </div>
      </div>

      <!-- Estimated TWD -->
      <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-4 rounded-2xl shadow-sm">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1 flex justify-between items-center">
          <span>估算 (TWD)</span>
          <span class="text-[10px] bg-slate-700 px-1.5 py-0.5 rounded text-slate-300">匯率:<span id="rateDisplay">0.21</span></span>
        </div>
        <div class="text-2xl font-black text-emerald-400 tracking-tight flex items-baseline">
          <span class="text-xs font-bold text-emerald-400 mr-1">NT$</span>
          <span id="totalTwd">0</span>
        </div>
        <div class="text-[11px] text-slate-400 mt-1">
          <span>今日: NT$<span id="todayTwd">0</span></span>
        </div>
      </div>
    </section>

    <!-- Initial Quick Entry Section (Top of Page) -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
          <span>⚡</span> 快速記帳
        </h2>
        <button id="btnScanAiTop" class="text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition-colors">
          <i class="fa-solid fa-camera"></i> AI 辨識收據
        </button>
      </div>

      <form id="quickExpenseForm" class="space-y-3">
        <!-- Amount & Merchant Grid -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-1">日圓金額 (JPY) *</label>
            <div class="relative">
              <span class="absolute left-2.5 top-1/2 -translate-y-1/2 font-extrabold text-slate-400 text-sm">¥</span>
              <input type="number" id="quickAmount" required placeholder="0" step="1" min="0"
                class="w-full pl-7 pr-2 py-2 bg-slate-50 border border-slate-200 rounded-xl font-black text-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all">
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-1">店家 / 項目 *</label>
            <input type="text" id="quickMerchant" required placeholder="例: 7-Eleven"
              class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all">
          </div>
        </div>

        <!-- Category & Date Grid -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-1">類別</label>
            <select id="quickCategory" class="w-full px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all">
              <option value="餐飲">🍜 餐飲</option>
              <option value="購物">🛍️ 購物</option>
              <option value="交通">🚃 交通</option>
              <option value="住宿">🏨 住宿</option>
              <option value="娛樂">🎟️ 娛樂</option>
              <option value="其他">📦 其他</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-1">日期</label>
            <input type="date" id="quickDate" required
              class="w-full px-2 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all">
          </div>
        </div>

        <!-- Notes -->
        <div>
          <input type="text" id="quickNotes" placeholder="中文備註 (選填)..."
            class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl shadow-md active:scale-[0.99] transition-all text-sm flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-plus text-xs"></i> 儲存此筆記帳
        </button>
      </form>
    </section>

    <!-- Category Filter Bar -->
    <section class="flex gap-2 overflow-x-auto no-scrollbar py-1">
      <button class="cat-filter-btn active bg-slate-900 text-white text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap shadow-sm transition-all" data-cat="all">全部</button>
      <button class="cat-filter-btn bg-white text-slate-600 hover:bg-slate-100 text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap border border-slate-200 transition-all" data-cat="餐飲">🍜 餐飲</button>
      <button class="cat-filter-btn bg-white text-slate-600 hover:bg-slate-100 text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap border border-slate-200 transition-all" data-cat="購物">🛍️ 購物</button>
      <button class="cat-filter-btn bg-white text-slate-600 hover:bg-slate-100 text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap border border-slate-200 transition-all" data-cat="交通">🚃 交通</button>
      <button class="cat-filter-btn bg-white text-slate-600 hover:bg-slate-100 text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap border border-slate-200 transition-all" data-cat="住宿">🏨 住宿</button>
      <button class="cat-filter-btn bg-white text-slate-600 hover:bg-slate-100 text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap border border-slate-200 transition-all" data-cat="娛樂">🎟️ 娛樂</button>
      <button class="cat-filter-btn bg-white text-slate-600 hover:bg-slate-100 text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap border border-slate-200 transition-all" data-cat="其他">📦 其他</button>
    </section>

    <!-- Expense List Header & Sheet Export Tools -->
    <section class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 pt-1">
      <h2 class="font-bold text-slate-700 text-sm tracking-wide flex items-center gap-1.5">
        <i class="fa-solid fa-list-ul text-red-500"></i> 消費明細
        <span id="recordCount" class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-normal">0 筆</span>
      </h2>
      <div class="flex items-center gap-1.5 w-full sm:w-auto">
        <!-- New Copy to Sheet Button -->
        <button id="btnCopySheet" class="flex-1 sm:flex-none text-xs font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-2.5 py-1.5 rounded-lg flex items-center justify-center gap-1 transition-colors">
          <i class="fa-regular fa-copy"></i> 複製到試算表
        </button>
        <button id="btnExportCsv" class="text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-200 px-2 py-1.5 rounded-lg flex items-center justify-center gap-1 transition-colors" title="下載 CSV">
          <i class="fa-solid fa-file-csv"></i> CSV
        </button>
      </div>
    </section>

    <!-- Expense Items List Container -->
    <section id="expenseList" class="space-y-2.5 min-h-[250px]">
      <!-- Expense Items will be rendered here dynamically -->
    </section>

  </main>

  <!-- Bottom Floating Action Bar -->
  <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-3 bg-white/95 backdrop-blur-md border-t border-slate-200 flex gap-2 z-20 shadow-lg">
    <!-- Camera AI Button -->
    <button id="btnScanAi" class="flex-1 bg-gradient-to-r from-red-600 to-rose-600 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-red-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
      <i class="fa-solid fa-camera text-lg"></i>
      <span>AI 辨識收據</span>
    </button>
    
    <!-- Manual Entry Button -->
    <button id="btnAddManual" class="bg-slate-900 text-white font-semibold py-3 px-4 rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
      <i class="fa-solid fa-plus text-base"></i>
      <span>手動記帳</span>
    </button>
  </div>

  <!-- Hidden File Input for Camera/Gallery Upload -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

  <!-- ================= MODALS ================= -->

  <!-- 1. AI Scanning Processing Modal -->
  <div id="aiScanModal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl border border-slate-100 animate-fade-in">
      <div class="relative w-20 h-20 mx-auto mb-4 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full border-4 border-rose-100 border-t-red-600 animate-spin"></div>
        <span class="text-3xl">🔍</span>
      </div>
      <h3 class="font-bold text-slate-800 text-base mb-1">Gemini AI 解析中...</h3>
      <p class="text-xs text-slate-500 mb-4">正在讀取收據金額、品名並自動翻譯成中文備註...</p>
      <div id="aiProgressStatus" class="text-xs font-semibold text-rose-600 bg-rose-50 py-1.5 px-3 rounded-full">
        上傳圖片中...
      </div>
    </div>
  </div>

  <!-- 2. Edit Expense Modal -->
  <div id="expenseModal" class="fixed inset-0 modal-backdrop z-40 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
      
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-base flex items-center gap-2">
          <span>✏️</span> 編輯消費紀錄
        </h3>
        <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="expenseForm" class="space-y-4">
        <input type="hidden" id="editRecordId">

        <!-- Amount JPY (Prominent) -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">日幣金額 (JPY) *</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 font-extrabold text-slate-400 text-lg">¥</span>
            <input type="number" id="inputAmount" required placeholder="0" step="1" min="0"
              class="w-full pl-8 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-black text-2xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all">
          </div>
          <div class="text-right text-xs text-slate-400 mt-1">
            約 NT$ <span id="inputTwdPreview" class="font-semibold text-slate-700">0</span>
          </div>
        </div>

        <!-- Merchant Name -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">店家 / 項目 *</label>
          <input type="text" id="inputMerchant" required placeholder="例: 7-Eleven, 敘敘苑, Suica"
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all">
        </div>

        <!-- Category & Date Grid -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">類別 *</label>
            <select id="inputCategory" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all">
              <option value="餐飲">🍜 餐飲</option>
              <option value="購物">🛍️ 購物</option>
              <option value="交通">🚃 交通</option>
              <option value="住宿">🏨 住宿</option>
              <option value="娛樂">🎟️ 娛樂</option>
              <option value="其他">📦 其他</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">日期 *</label>
            <input type="date" id="inputDate" required
              class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all">
          </div>
        </div>

        <!-- Translated Notes / Details -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">備註 / 品名明細 (中日文對照)</label>
          <textarea id="inputNotes" rows="3" placeholder="AI 會自動將日文品名翻譯填寫於此..."
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all"></textarea>
        </div>

        <!-- Actions -->
        <div class="flex gap-2 pt-2">
          <button type="button" id="btnDeleteRecord" class="hidden px-4 py-3 bg-rose-50 text-rose-600 hover:bg-rose-100 font-semibold text-sm rounded-xl transition-colors">
            刪除
          </button>
          <button type="submit" class="flex-1 bg-slate-900 text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-[0.98] transition-all">
            儲存變更
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- 3. Settings Modal (API Key & Exchange Rate) -->
  <div id="settingsModal" class="fixed inset-0 modal-backdrop z-40 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-slate-100">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <i class="fa-solid fa-sliders text-red-500"></i> 設定與偏好
        </h3>
        <button id="btnCloseSettings" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="space-y-4">
        <!-- Gemini API Key -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Gemini API Key (用於 AI 辨識)</label>
          <input type="password" id="cfgApiKey" placeholder="貼上 AI Studio 取得的 API Key"
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
          <p class="text-[11px] text-slate-400 mt-1">
            未設定時可以手動記帳。可至 <a href="https://aistudio.google.com/" target="_blank" class="text-red-500 underline">Google AI Studio</a> 免費申請。
          </p>
        </div>

        <!-- Exchange Rate JPY to TWD -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">日圓兌台幣匯率 (TWD Rate)</label>
          <input type="number" id="cfgExchangeRate" step="0.001" placeholder="0.21"
            class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
          <p class="text-[11px] text-slate-400 mt-1">預設 0.21 (即 1000 JPY ≈ 210 TWD)</p>
        </div>

        <!-- Clear All Data Button -->
        <div class="pt-2 border-t border-slate-100">
          <button id="btnClearData" class="w-full text-xs text-rose-500 hover:text-rose-700 py-1.5 font-medium transition-colors">
            清空所有記帳資料
          </button>
        </div>

        <button id="btnSaveSettings" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl shadow transition-all">
          儲存設定
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg backdrop-blur-sm z-50 transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">提示訊息</span>
  </div>

  <!-- APP LOGIC SCRIPT -->
  <script>
    // --- APP STATE & LOCALSTORAGE CONSTANTS ---
    const STORAGE_KEY_RECORDS = 'jp_travel_records_v1';
    const STORAGE_KEY_SETTINGS = 'jp_travel_settings_v1';

    let records = [];
    let settings = {
      apiKey: '',
      exchangeRate: 0.21
    };
    let currentCategoryFilter = 'all';

    // --- DOM ELEMENTS ---
    const totalJpyEl = document.getElementById('totalJpy');
    const totalTwdEl = document.getElementById('totalTwd');
    const todayJpyEl = document.getElementById('todayJpy');
    const todayTwdEl = document.getElementById('todayTwd');
    const rateDisplayEl = document.getElementById('rateDisplay');
    const recordCountEl = document.getElementById('recordCount');
    const expenseListEl = document.getElementById('expenseList');

    const btnScanAiTop = document.getElementById('btnScanAiTop');
    const btnScanAi = document.getElementById('btnScanAi');
    const btnAddManual = document.getElementById('btnAddManual');
    const cameraInput = document.getElementById('cameraInput');
    const btnExportCsv = document.getElementById('btnExportCsv');
    const btnCopySheet = document.getElementById('btnCopySheet');

    const quickExpenseForm = document.getElementById('quickExpenseForm');
    const quickAmount = document.getElementById('quickAmount');
    const quickMerchant = document.getElementById('quickMerchant');
    const quickCategory = document.getElementById('quickCategory');
    const quickDate = document.getElementById('quickDate');
    const quickNotes = document.getElementById('quickNotes');

    const aiScanModal = document.getElementById('aiScanModal');
    const aiProgressStatus = document.getElementById('aiProgressStatus');

    const expenseModal = document.getElementById('expenseModal');
    const modalTitle = document.getElementById('modalTitle');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const expenseForm = document.getElementById('expenseForm');
    const editRecordIdInput = document.getElementById('editRecordId');
    const inputAmount = document.getElementById('inputAmount');
    const inputMerchant = document.getElementById('inputMerchant');
    const inputCategory = document.getElementById('inputCategory');
    const inputDate = document.getElementById('inputDate');
    const inputNotes = document.getElementById('inputNotes');
    const inputTwdPreview = document.getElementById('inputTwdPreview');
    const btnDeleteRecord = document.getElementById('btnDeleteRecord');

    const settingsModal = document.getElementById('settingsModal');
    const btnSettings = document.getElementById('btnSettings');
    const btnCloseSettings = document.getElementById('btnCloseSettings');
    const btnSaveSettings = document.getElementById('btnSaveSettings');
    const cfgApiKey = document.getElementById('cfgApiKey');
    const cfgExchangeRate = document.getElementById('cfgExchangeRate');
    const apiKeyBadge = document.getElementById('apiKeyBadge');
    const btnClearData = document.getElementById('btnClearData');

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      loadRecords();
      renderApp();
      
      const todayStr = new Date().toISOString().split('T')[0];
      inputDate.value = todayStr;
      quickDate.value = todayStr;
    });

    // --- STORAGE HANDLERS ---
    function loadSettings() {
      const saved = localStorage.getItem(STORAGE_KEY_SETTINGS);
      if (saved) {
        try {
          settings = { ...settings, ...JSON.parse(saved) };
        } catch(e) { console.error('Error loading settings', e); }
      }
      cfgApiKey.value = settings.apiKey || '';
      cfgExchangeRate.value = settings.exchangeRate || 0.21;
      rateDisplayEl.textContent = settings.exchangeRate;
      
      if (settings.apiKey) {
        apiKeyBadge.classList.remove('hidden');
      } else {
        apiKeyBadge.classList.add('hidden');
      }
    }

    function saveSettings() {
      settings.apiKey = cfgApiKey.value.trim();
      settings.exchangeRate = parseFloat(cfgExchangeRate.value) || 0.21;
      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
      loadSettings();
      renderApp();
      showToast('⚙️ 設定已儲存');
      settingsModal.classList.add('hidden');
    }

    function loadRecords() {
      const saved = localStorage.getItem(STORAGE_KEY_RECORDS);
      if (saved) {
        try {
          records = JSON.parse(saved);
        } catch(e) { records = []; }
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
      renderApp();
    }

    // --- QUICK EXPENSE FORM (HOME PAGE INITIAL INPUT) ---
    quickExpenseForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = parseFloat(quickAmount.value) || 0;
      const merchant = quickMerchant.value.trim();
      const category = quickCategory.value;
      const date = quickDate.value;
      const notes = quickNotes.value.trim();

      const newRecord = {
        id: 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        amount,
        merchant,
        category,
        date,
        notes,
        createdAt: Date.now()
      };

      records.push(newRecord);
      saveRecords();

      // Reset Quick Input
      quickAmount.value = '';
      quickMerchant.value = '';
      quickNotes.value = '';
      quickAmount.focus();

      showToast('✅ 已成功記帳一筆！');
    });

    // --- RENDER FUNCTIONS ---
    function renderApp() {
      const todayStr = new Date().toISOString().split('T')[0];
      
      let grandTotalJpy = 0;
      let todayTotalJpy = 0;

      const filteredRecords = records.filter(r => {
        if (currentCategoryFilter === 'all') return true;
        return r.category === currentCategoryFilter;
      });

      records.forEach(r => {
        const amt = Number(r.amount) || 0;
        grandTotalJpy += amt;
        if (r.date === todayStr) {
          todayTotalJpy += amt;
        }
      });

      totalJpyEl.textContent = grandTotalJpy.toLocaleString();
      totalTwdEl.textContent = Math.round(grandTotalJpy * settings.exchangeRate).toLocaleString();
      todayJpyEl.textContent = todayTotalJpy.toLocaleString();
      todayTwdEl.textContent = Math.round(todayTotalJpy * settings.exchangeRate).toLocaleString();
      recordCountEl.textContent = `${filteredRecords.length} 筆`;

      expenseListEl.innerHTML = '';

      if (filteredRecords.length === 0) {
        expenseListEl.innerHTML = `
          <div class="text-center py-10 bg-white rounded-2xl border border-dashed border-slate-200">
            <span class="text-3xl block mb-2">💴</span>
            <p class="text-sm font-semibold text-slate-600">尚無消費紀錄</p>
            <p class="text-xs text-slate-400 mt-1">上方輸入金額即可快速完成記帳</p>
          </div>
        `;
        return;
      }

      const sorted = [...filteredRecords].sort((a, b) => new Date(b.date) - new Date(a.date) || b.createdAt - a.createdAt);

      sorted.forEach(item => {
        const twdEstimate = Math.round(item.amount * settings.exchangeRate);
        const catEmoji = getCategoryEmoji(item.category);

        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-2 hover:border-slate-300 transition-all cursor-pointer";
        card.onclick = () => openEditModal(item.id);

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center text-lg shrink-0">
                ${catEmoji}
              </div>
              <div>
                <h4 class="font-bold text-slate-800 text-sm leading-tight">${escapeHtml(item.merchant)}</h4>
                <div class="flex items-center gap-2 text-[11px] text-slate-400 mt-0.5">
                  <span>${item.date}</span>
                  <span>•</span>
                  <span class="bg-slate-100 px-1.5 py-0.2 rounded text-slate-500 font-medium">${item.category}</span>
                </div>
              </div>
            </div>
            <div class="text-right">
              <div class="font-black text-slate-900 text-base leading-tight">
                <span class="text-xs text-red-500 font-bold">¥</span>${Number(item.amount).toLocaleString()}
              </div>
              <div class="text-[11px] font-medium text-slate-400 mt-0.5">
                NT$ ${twdEstimate.toLocaleString()}
              </div>
            </div>
          </div>
          ${item.notes ? `
            <div class="text-xs text-slate-600 bg-slate-50 p-2 rounded-xl border border-slate-100/80 leading-relaxed font-sans whitespace-pre-line">
              <span class="font-semibold text-slate-400">📝 備註:</span> ${escapeHtml(item.notes)}
            </div>
          ` : ''}
        `;
        expenseListEl.appendChild(card);
      });
    }

    function getCategoryEmoji(cat) {
      const map = {
        '餐飲': '🍜',
        '購物': '🛍️',
        '交通': '🚃',
        '住宿': '🏨',
        '娛樂': '🎟️',
        '其他': '📦'
      };
      return map[cat] || '🏷️';
    }

    // --- EDIT MODAL HANDLERS ---
    btnAddManual.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      quickAmount.focus();
    });

    function openEditModal(id) {
      const record = records.find(r => r.id === id);
      if (!record) return;

      modalTitle.innerHTML = '<span>✏️</span> 編輯消費紀錄';
      editRecordIdInput.value = record.id;
      inputAmount.value = record.amount;
      inputMerchant.value = record.merchant;
      inputCategory.value = record.category;
      inputDate.value = record.date;
      inputNotes.value = record.notes || '';
      
      updateTwdPreview();
      btnDeleteRecord.classList.remove('hidden');
      expenseModal.classList.remove('hidden');
    }

    btnCloseModal.addEventListener('click', () => expenseModal.classList.add('hidden'));

    inputAmount.addEventListener('input', updateTwdPreview);

    function updateTwdPreview() {
      const val = parseFloat(inputAmount.value) || 0;
      inputTwdPreview.textContent = Math.round(val * settings.exchangeRate).toLocaleString();
    }

    expenseForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const id = editRecordIdInput.value;
      const amount = parseFloat(inputAmount.value) || 0;
      const merchant = inputMerchant.value.trim();
      const category = inputCategory.value;
      const date = inputDate.value;
      const notes = inputNotes.value.trim();

      if (id) {
        const index = records.findIndex(r => r.id === id);
        if (index !== -1) {
          records[index] = { ...records[index], amount, merchant, category, date, notes };
          showToast('✏️ 紀錄已成功更新');
        }
      }

      saveRecords();
      expenseModal.classList.add('hidden');
    });

    btnDeleteRecord.addEventListener('click', () => {
      const id = editRecordIdInput.value;
      if (!id) return;
      if (confirm('確定要刪除這筆消費紀錄嗎？')) {
        records = records.filter(r => r.id !== id);
        saveRecords();
        expenseModal.classList.add('hidden');
        showToast('🗑️ 已刪除該筆紀錄');
      }
    });

    // Category Filter Buttons
    document.querySelectorAll('.cat-filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.cat-filter-btn').forEach(b => {
          b.className = "cat-filter-btn bg-white text-slate-600 hover:bg-slate-100 text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap border border-slate-200 transition-all";
        });
        e.target.className = "cat-filter-btn active bg-slate-900 text-white text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap shadow-sm transition-all";
        currentCategoryFilter = e.target.dataset.cat;
        renderApp();
      });
    });

    // --- SETTINGS MODAL ---
    btnSettings.addEventListener('click', () => {
      cfgApiKey.value = settings.apiKey || '';
      cfgExchangeRate.value = settings.exchangeRate || 0.21;
      settingsModal.classList.remove('hidden');
    });

    btnCloseSettings.addEventListener('click', () => settingsModal.classList.add('hidden'));
    btnSaveSettings.addEventListener('click', saveSettings);

    btnClearData.addEventListener('click', () => {
      if (confirm('警告：這將會清除「所有」已存的記帳紀錄！確定嗎？')) {
        records = [];
        saveRecords();
        settingsModal.classList.add('hidden');
        showToast('🧹 資料已清空');
      }
    });

    // --- GEMINI AI CAMERA RECEIPT OCR & TRANSLATION ---
    const triggerScan = () => {
      if (!settings.apiKey) {
        showToast('⚠️ 請先點擊右上角⚙️設定 Gemini API Key');
        btnSettings.click();
        return;
      }
      cameraInput.click();
    };

    btnScanAi.addEventListener('click', triggerScan);
    btnScanAiTop.addEventListener('click', triggerScan);

    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      aiProgressStatus.textContent = '圖片壓縮處理中...';
      aiScanModal.classList.remove('hidden');

      try {
        const base64Data = await resizeAndBase64(file);
        
        aiProgressStatus.textContent = 'AI 解析中 (Gemini 2.5)...';
        const aiResult = await analyzeReceiptWithGemini(base64Data);

        aiScanModal.classList.add('hidden');

        // Populate to quick form or edit modal
        quickAmount.value = aiResult.amount || '';
        quickMerchant.value = aiResult.merchant || '日本店家';
        if (aiResult.category) quickCategory.value = aiResult.category;
        if (aiResult.date) quickDate.value = aiResult.date;
        quickNotes.value = aiResult.translated_items || '';

        window.scrollTo({ top: 0, behavior: 'smooth' });
        quickAmount.focus();

        showToast('✨ 收據辨識完成，請確認金額後儲存！');
      } catch (err) {
        aiScanModal.classList.add('hidden');
        console.error(err);
        alert('AI 解析失敗: ' + err.message);
      } finally {
        cameraInput.value = '';
      }
    });

    function resizeAndBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 1200;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            resolve(dataUrl.split(',')[1]);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Call Fixed Gemini 2.5 Flash API
    async function analyzeReceiptWithGemini(base64Image) {
      const apiKey = settings.apiKey;
      // UPDATED TO USE GEMINI 2.5 FLASH API ENDPOINT
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      const promptText = `請細心分析這張日本收據或發票圖像，並以嚴格的 JSON 格式回答：
{
  "date": "YYYY-MM-DD 格式 (若無法判讀則傳回今日日期)",
  "merchant": "店家名稱 (例如 7-Eleven, Lawson, 敘敘苑, Suica 儲值等)",
  "amount": 純數字總消費金額JPY (注意標示之含稅總額「税込金額/合計」)，不要加逗號或貨幣符號,
  "category": "分類名稱，只能從這六個選擇：餐飲 / 購物 / 交通 / 住宿 / 娛樂 / 其他",
  "translated_items": "條列出主要購買商品之【日文原文 -> 繁體中文翻譯】，例如：\n• おにぎり -> 明太子飯糰 x1\n• 緑茶 -> 綠茶 500ml x1"
}`;

      const payload = {
        contents: [
          {
            parts: [
              { text: promptText },
              {
                inlineData: {
                  mimeType: "image/jpeg",
                  data: base64Image
                }
              }
            ]
          }
        ],
        generationConfig: {
          responseMimeType: "application/json"
        }
      };

      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errorErr = await res.json().catch(() => ({}));
        throw new Error(errorErr.error?.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!textResponse) {
        throw new Error('AI 未能傳回有效的文字回應');
      }

      return JSON.parse(textResponse);
    }

    // --- COPY TO GOOGLE SHEETS (TSV FORMAT) ---
    btnCopySheet.addEventListener('click', () => {
      if (records.length === 0) {
        showToast('⚠️ 目前沒有任何記帳紀錄可複製');
        return;
      }

      // Format as Tab-Separated Values (TSV) for seamless paste into Google Sheets
      let tsvLines = ["日期\t店家/項目\t日圓金額(JPY)\t估算台幣(TWD)\t類別\t備註明細(中文翻譯)"];

      // Sort chronological
      const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));

      sorted.forEach(r => {
        const twd = Math.round(r.amount * settings.exchangeRate);
        const cleanMerchant = (r.merchant || '').replace(/[\t\r\n]/g, ' ');
        const cleanNotes = (r.notes || '').replace(/[\t\r\n]/g, ' ');
        tsvLines.push(`${r.date}\t${cleanMerchant}\t${r.amount}\t${twd}\t${r.category}\t${cleanNotes}`);
      });

      const copyText = tsvLines.join('\n');

      // Use document.execCommand fallback for iframe / mobile security compatibility
      const tempTextArea = document.createElement('textarea');
      tempTextArea.value = copyText;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showToast('📋 已複製！請至 Google 試算表直接貼上 (Ctrl+V)');
        } else {
          showToast('⚠️ 複製失敗，請重試');
        }
      } catch (err) {
        showToast('⚠️ 瀏覽器不支援一鍵複製');
      } finally {
        document.body.removeChild(tempTextArea);
      }
    });

    // --- CSV EXPORT FOR GOOGLE SHEETS ---
    btnExportCsv.addEventListener('click', () => {
      if (records.length === 0) {
        showToast('⚠️ 目前沒有任何記帳紀錄可匯出');
        return;
      }

      let csvContent = "\uFEFF";
      csvContent += "ID,日期,店家/項目,日圓金額 (JPY),估算台幣 (TWD),類別,備註明細 (中日文翻譯)\n";

      records.forEach(r => {
        const twd = Math.round(r.amount * settings.exchangeRate);
        const safeMerchant = `"${(r.merchant || '').replace(/"/g, '""')}"`;
        const safeNotes = `"${(r.notes || '').replace(/"/g, '""')}"`;

        csvContent += `${r.id},${r.date},${safeMerchant},${r.amount},${twd},${r.category},${safeNotes}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `日本旅遊記帳_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      showToast('📥 已成功匯出 CSV 檔案！');
    });

    // --- UTILS ---
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;

      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }
  </script>
