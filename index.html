<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本旅遊快速記帳本</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .modal-active { display: flex !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">
  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col relative">
    
    <!-- Header -->
    <header class="bg-red-600 text-white p-4 sticky top-0 z-10 shadow-md">
      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
          <span>🇯🇵</span> 日本旅遊記帳
        </h1>
        <div class="flex items-center gap-2">
          <button onclick="openVisionModal()" class="bg-purple-700 hover:bg-purple-800 text-xs px-2.5 py-1.5 rounded-full border border-purple-400 transition flex items-center gap-1 shadow">
            <span>📸</span> 拍照/上傳
          </button>
          <button onclick="changeRate()" class="bg-red-700 hover:bg-red-800 text-xs px-2.5 py-1.5 rounded-full border border-red-400 transition">
            匯率: <span id="rateDisplay">0.215</span> ✏️
          </button>
        </div>
      </div>
      <div class="mt-3 bg-red-700/60 p-3 rounded-lg flex justify-between items-end">
        <div>
          <div class="text-xs text-red-200">總支出 (日幣 JPY)</div>
          <div class="text-2xl font-bold" id="totalJpy">¥ 0</div>
        </div>
        <div class="text-right">
          <div class="text-xs text-red-200">約合台幣 (TWD)</div>
          <div class="text-lg font-semibold text-red-100" id="totalTwd">NT$ 0</div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 flex-1 flex flex-col gap-4">
      
      <!-- Input Form -->
      <section class="bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">金額 (JPY)</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-400 font-bold">¥</span>
            <input type="number" id="amount" placeholder="0" class="w-full pl-8 pr-3 py-2 text-xl font-bold border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500" inputmode="numeric">
          </div>
        </div>

        <!-- Quick Amount Buttons -->
        <div class="grid grid-cols-4 gap-1.5">
          <button onclick="addAmount(100)" class="bg-white border border-slate-300 hover:bg-slate-100 py-1 rounded text-xs font-medium text-slate-700">+100</button>
          <button onclick="addAmount(500)" class="bg-white border border-slate-300 hover:bg-slate-100 py-1 rounded text-xs font-medium text-slate-700">+500</button>
          <button onclick="addAmount(1000)" class="bg-white border border-slate-300 hover:bg-slate-100 py-1 rounded text-xs font-medium text-slate-700">+1000</button>
          <button onclick="addAmount(5000)" class="bg-white border border-slate-300 hover:bg-slate-100 py-1 rounded text-xs font-medium text-slate-700">+5000</button>
        </div>

        <!-- Category Selector -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">消費分類</label>
          <div class="grid grid-cols-4 gap-2" id="categoryGrid"></div>
        </div>

        <!-- Payment Method & Note -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">支付方式</label>
            <select id="payment" class="w-full p-2 text-sm border border-slate-300 rounded-lg bg-white">
              <option value="現金">💵 現金</option>
              <option value="IC卡">🐧 IC卡 (Suica)</option>
              <option value="信用卡">💳 信用卡</option>
              <option value="PayPay">📱 PayPay</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">備註 (可不填)</label>
            <input type="text" id="note" placeholder="例: 藥妝、拉麵" class="w-full p-2 text-sm border border-slate-300 rounded-lg">
          </div>
        </div>

        <button onclick="addRecord()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition shadow">
          新增紀錄
        </button>
      </section>

      <!-- Actions for Copy -->
      <section class="flex gap-2">
        <button onclick="copyTSV()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg flex items-center justify-center gap-1 transition shadow">
          📋 複製 Google 試算表格式 (TSV)
        </button>
        <button onclick="clearAll()" class="bg-slate-200 hover:bg-slate-300 text-slate-600 text-xs font-medium py-2 px-3 rounded-lg transition">
          清空
        </button>
      </section>

      <!-- Expense List -->
      <section class="flex-1">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">消費明細</h2>
        <div id="recordsList" class="space-y-2"></div>
      </section>
    </main>
  </div>

  <!-- Vision API / Image Upload Modal -->
  <div id="visionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-4 shadow-xl flex flex-col gap-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 flex items-center gap-1">📸 AI 拍照辨識發票/收據</h3>
        <button onclick="closeVisionModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold text-slate-600">Gemini API Key</label>
          <button onclick="setApiKey()" class="text-[10px] text-purple-600 hover:underline">重新設定</button>
        </div>
        <input type="password" id="apiKeyInput" placeholder="貼上您的 Gemini API Key" class="w-full p-2 text-xs border rounded-lg bg-slate-50">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">選擇照片或拍照</label>
        <input type="file" id="receiptImage" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
      </div>

      <!-- Preview Image -->
      <div id="imagePreviewContainer" class="hidden">
        <label class="block text-[10px] text-slate-400 mb-1">發票照片預覽：</label>
        <div class="w-full max-h-48 overflow-hidden rounded-lg border border-slate-200 bg-slate-50 flex items-center justify-center">
          <img id="imagePreview" src="" class="object-contain max-h-48 w-full">
        </div>
      </div>

      <button id="analyzeBtn" onclick="analyzeReceipt()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-lg text-sm transition flex items-center justify-center gap-2">
        <span>開始 AI 辨識與日文翻譯</span>
      </button>

      <!-- Result Container -->
      <div id="visionResult" class="hidden space-y-3 bg-purple-50 p-3 rounded-xl border border-purple-200 text-xs">
        <div class="font-bold text-purple-900 border-b border-purple-200 pb-1">✨ 辨識結果與日文翻譯</div>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <span class="text-slate-500">總金額 (JPY):</span>
            <input type="number" id="visionAmount" class="w-full p-1 font-bold border rounded bg-white">
          </div>
          <div>
            <span class="text-slate-500">消費分類:</span>
            <input type="text" id="visionCategory" class="w-full p-1 border rounded bg-white">
          </div>
        </div>

        <div>
          <span class="text-slate-500">店家與商品翻譯 summary:</span>
          <input type="text" id="visionNote" class="w-full p-1 border rounded bg-white">
        </div>

        <button onclick="applyVisionResult()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 rounded transition">
          直接填入單筆記帳
        </button>

        <!-- Items Breakdown Section -->
        <div id="itemsContainer" class="hidden pt-2 border-t border-purple-200">
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-slate-700">🧾 發票商品明細拆單：</span>
            <button onclick="importAllItems()" class="bg-purple-700 hover:bg-purple-800 text-white text-[10px] px-2 py-1 rounded">一鍵匯入全部明細</button>
          </div>
          <div id="itemsList" class="space-y-1 max-h-36 overflow-y-auto"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Item Modal -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-4 shadow-xl flex flex-col gap-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800">✏️ 編輯消費紀錄</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <input type="hidden" id="editId">

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">金額 (JPY)</label>
        <input type="number" id="editAmount" class="w-full p-2 border rounded-lg font-bold">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">消費分類</label>
          <select id="editCategory" class="w-full p-2 border rounded-lg text-xs bg-white"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">支付方式</label>
          <select id="editPayment" class="w-full p-2 border rounded-lg text-xs bg-white">
            <option value="現金">💵 現金</option>
            <option value="IC卡">🐧 IC卡 (Suica)</option>
            <option value="信用卡">💳 信用卡</option>
            <option value="PayPay">📱 PayPay</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">備註</label>
        <input type="text" id="editNote" class="w-full p-2 border rounded-lg text-xs">
      </div>

      <div class="flex gap-2 mt-2">
        <button onclick="saveEdit()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg text-xs">
          儲存修改
        </button>
        <button onclick="closeEditModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-600 py-2 px-4 rounded-lg text-xs">
          取消
        </button>
      </div>
    </div>
  </div>

  <script>
    let rate = parseFloat(localStorage.getItem('jpy_rate')) || 0.215;
    let records = JSON.parse(localStorage.getItem('jpy_records')) || [];
    let selectedCategory = '餐飲';
    let visionExtractedItems = [];

    const categories = [
      { name: '餐飲', icon: '🍱' },
      { name: '交通', icon: '🚃' },
      { name: '購物', icon: '🛍️' },
      { name: '景點', icon: '🎟️' },
      { name: '住宿', icon: '🏨' },
      { name: '便利商店', icon: '🏪' },
      { name: '娛樂', icon: '🎮' },
      { name: '其他', icon: '🎈' }
    ];

    function init() {
      document.getElementById('rateDisplay').innerText = rate;
      const key = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('apiKeyInput').value = key;
      
      renderCategories();
      renderRecords();

      document.getElementById('receiptImage').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            document.getElementById('imagePreview').src = evt.target.result;
            document.getElementById('imagePreviewContainer').classList.remove('hidden');
          };
          reader.readAsDataURL(file);
        }
      });
    }

    function changeRate() {
      const input = prompt('請輸入日幣匯率 (日幣 x 匯率 = 台幣):', rate);
      if (input && !isNaN(input)) {
        rate = parseFloat(input);
        localStorage.setItem('jpy_rate', rate);
        document.getElementById('rateDisplay').innerText = rate;
        renderRecords();
      }
    }

    function renderCategories() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = categories.map(cat => `
        <button onclick="selectCategory('${cat.name}')" 
                class="cat-btn p-2 rounded-lg border text-xs font-medium flex flex-col items-center gap-1 transition ${selectedCategory === cat.name ? 'border-red-500 bg-red-50 text-red-600' : 'border-slate-200 bg-white text-slate-600'}">
          <span class="text-base">${cat.icon}</span>
          <span>${cat.name}</span>
        </button>
      `).join('');

      const editCat = document.getElementById('editCategory');
      editCat.innerHTML = categories.map(c => `<option value="${c.name}">${c.icon} ${c.name}</option>`).join('');
    }

    function selectCategory(catName) {
      selectedCategory = catName;
      renderCategories();
    }

    function addAmount(val) {
      const input = document.getElementById('amount');
      const current = parseFloat(input.value) || 0;
      input.value = current + val;
    }

    function addRecord() {
      const amountEl = document.getElementById('amount');
      const amount = parseFloat(amountEl.value);
      if (!amount || amount <= 0) return alert('請輸入有效金額');

      const now = new Date();
      const record = {
        id: Date.now(),
        date: `${now.getMonth()+1}/${now.getDate()}`,
        time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
        category: selectedCategory,
        jpy: amount,
        payment: document.getElementById('payment').value,
        note: document.getElementById('note').value.trim()
      };

      records.unshift(record);
      saveAndRender();

      amountEl.value = '';
      document.getElementById('note').value = '';
    }

    function deleteRecord(id) {
      if (confirm('確定要刪除這筆紀錄嗎？')) {
        records = records.filter(r => r.id !== id);
        saveAndRender();
      }
    }

    function openEditModal(id) {
      const record = records.find(r => r.id === id);
      if (!record) return;

      document.getElementById('editId').value = record.id;
      document.getElementById('editAmount').value = record.jpy;
      document.getElementById('editCategory').value = record.category;
      document.getElementById('editPayment').value = record.payment;
      document.getElementById('editNote').value = record.note || '';

      document.getElementById('editModal').classList.add('modal-active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('modal-active');
    }

    function saveEdit() {
      const id = parseInt(document.getElementById('editId').value);
      const record = records.find(r => r.id === id);
      if (!record) return;

      const amt = parseFloat(document.getElementById('editAmount').value);
      if (!amt || amt <= 0) return alert('請輸入有效金額');

      record.jpy = amt;
      record.category = document.getElementById('editCategory').value;
      record.payment = document.getElementById('editPayment').value;
      record.note = document.getElementById('editNote').value.trim();

      saveAndRender();
      closeEditModal();
    }

    function saveAndRender() {
      localStorage.setItem('jpy_records', JSON.stringify(records));
      renderRecords();
    }

    function renderRecords() {
      const list = document.getElementById('recordsList');
      let totalJpy = 0;

      if (records.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">尚無消費紀錄</div>`;
      } else {
        list.innerHTML = records.map(r => {
          totalJpy += r.jpy;
          const twd = Math.round(r.jpy * rate);
          const catIcon = categories.find(c => c.name === r.category)?.icon || '📌';
          return `
            <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-lg">${catIcon}</div>
                <div>
                  <div class="text-xs font-bold text-slate-800">${r.category} <span class="font-normal text-slate-400">· ${r.payment}</span></div>
                  <div class="text-[10px] text-slate-400">${r.date} ${r.time} ${r.note ? '· ' + r.note : ''}</div>
                </div>
              </div>
              <div class="text-right flex items-center gap-2">
                <div>
                  <div class="text-sm font-bold text-slate-800">¥${r.jpy.toLocaleString()}</div>
                  <div class="text-[10px] text-slate-400">NT$ ${twd.toLocaleString()}</div>
                </div>
                <button onclick="openEditModal(${r.id})" class="text-slate-400 hover:text-blue-500 p-1 text-xs">✏️</button>
                <button onclick="deleteRecord(${r.id})" class="text-slate-300 hover:text-red-500 p-1 text-xs">✕</button>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('totalJpy').innerText = `¥ ${totalJpy.toLocaleString()}`;
      document.getElementById('totalTwd').innerText = `NT$ ${Math.round(totalJpy * rate).toLocaleString()}`;
    }

    // Modal Actions
    function openVisionModal() {
      document.getElementById('visionModal').classList.add('modal-active');
    }

    function closeVisionModal() {
      document.getElementById('visionModal').classList.remove('modal-active');
    }

    function setApiKey() {
      const key = prompt('請輸入您的 Gemini API Key:');
      if (key !== null) {
        const cleanKey = key.trim();
        localStorage.setItem('gemini_api_key', cleanKey);
        document.getElementById('apiKeyInput').value = cleanKey;
      }
    }

    function compressImage(file, maxWidth = 1000) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            resolve(dataUrl.split(',')[1]);
          };
        };
      });
    }

    async function analyzeReceipt() {
      let key = document.getElementById('apiKeyInput').value.trim();
      if (!key) {
        key = prompt('請輸入 Gemini API Key:');
        if (!key) return;
        key = key.trim();
        localStorage.setItem('gemini_api_key', key);
        document.getElementById('apiKeyInput').value = key;
      }

      const fileInput = document.getElementById('receiptImage');
      if (!fileInput.files || fileInput.files.length === 0) {
        return alert('請先選擇或拍攝照片');
      }

      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      btn.innerText = '🤖 AI 分析與翻譯中...';

      try {
        const base64Image = await compressImage(fileInput.files[0]);

        const promptText = `你是一個日本旅遊發票與收據分析專家。請分析這張發票並回答JSON格式數據：
1. total_jpy: 整張發票總金額(數字)
2. category: 分類(僅從"餐飲","交通","購物","景點","住宿","便利商店","娛樂","其他"選一個)
3. note_summary: 店家名稱與簡短的中文說明
4. items: 發票上的個別商品列表(陣列)，每項包含：
   - name: 日文商品名稱翻譯成繁體中文
   - jpy: 該項單價或總額(數字)

請務必只輸出標準 JSON 格式，例如：
{
  "total_jpy": 1280,
  "category": "餐飲",
  "note_summary": "一蘭拉麵 橫濱店",
  "items": [
    { "name": "天然豚骨拉麵", "jpy": 980 },
    { "name": "替玉 (加麵)", "jpy": 210 },
    { "name": "半熟水煮蛋", "jpy": 90 }
  ]
}`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'API 錯誤');

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const res = JSON.parse(rawText);

        document.getElementById('visionAmount').value = res.total_jpy || 0;
        document.getElementById('visionCategory').value = res.category || '購物';
        document.getElementById('visionNote').value = res.note_summary || '';

        const itemsContainer = document.getElementById('itemsContainer');
        const itemsList = document.getElementById('itemsList');
        visionExtractedItems = res.items || [];

        if (visionExtractedItems.length > 0) {
          itemsList.innerHTML = visionExtractedItems.map((it, idx) => `
            <div class="flex justify-between items-center bg-white p-1.5 rounded border border-purple-100 text-[11px]">
              <span class="text-slate-700 font-medium">${it.name}</span>
              <span class="font-bold text-purple-900">¥${it.jpy}</span>
            </div>
          `).join('');
          itemsContainer.classList.remove('hidden');
        } else {
          itemsContainer.classList.add('hidden');
        }

        document.getElementById('visionResult').classList.remove('hidden');
      } catch (err) {
        alert('辨識失敗: ' + err.message + '\n請檢查 API Key 或照片是否清楚');
      } finally {
        btn.disabled = false;
        btn.innerText = '開始 AI 辨識與日文翻譯';
      }
    }

    function applyVisionResult() {
      const amt = parseFloat(document.getElementById('visionAmount').value);
      if (!amt || amt <= 0) return alert('請確認金額');

      const now = new Date();
      const record = {
        id: Date.now(),
        date: `${now.getMonth()+1}/${now.getDate()}`,
        time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
        category: document.getElementById('visionCategory').value || '其他',
        jpy: amt,
        payment: '現金',
        note: document.getElementById('visionNote').value.trim()
      };

      records.unshift(record);
      saveAndRender();
      closeVisionModal();
      alert('已新增單筆帳目！');
    }

    function importAllItems() {
      if (!visionExtractedItems || visionExtractedItems.length === 0) return alert('沒有明細可匯入');

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const dateStr = `${now.getMonth()+1}/${now.getDate()}`;
      const cat = document.getElementById('visionCategory').value || '購物';

      visionExtractedItems.forEach((it, idx) => {
        records.unshift({
          id: Date.now() + idx,
          date: dateStr,
          time: timeStr,
          category: cat,
          jpy: it.jpy,
          payment: '現金',
          note: it.name
        });
      });

      saveAndRender();
      closeVisionModal();
      alert(`已匯入 ${visionExtractedItems.length} 筆明細商品！`);
    }

    function copyTSV() {
      if (records.length === 0) return alert('目前沒有紀錄可複製');
      let tsv = '日期	時間	分類	日幣(JPY)	台幣(TWD)	支付方式	備註
';
      records.forEach(r => {
        tsv += `${r.date}	${r.time}	${r.category}	${r.jpy}	${Math.round(r.jpy * rate)}	${r.payment}	${r.note}
`;
      });
      navigator.clipboard.writeText(tsv).then(() => {
        alert('已複製表格內容！開啟 Google 試算表直接貼上 (Ctrl+V) 即可。');
      });
    }

    function clearAll() {
      if (confirm('確定要清空所有記帳紀錄嗎？此動作無法復原。')) {
        records = [];
        saveAndRender();
      }
    }

    init();
  </script>
</body>
</html>
