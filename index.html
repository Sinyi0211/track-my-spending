<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅遊記帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased pb-24">

    <!-- Header & Summary Card -->
    <header class="bg-rose-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-plane-departure"></i> 日本旅遊記帳
            </h1>
            <button onclick="openSettingsModal()" class="text-white hover:text-rose-200 p-2">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Summary Cards -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-400 font-medium">總消費 (JPY)</p>
                <p id="totalJpy" class="text-2xl font-bold text-gray-800">¥0</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400 font-medium">預估折合 (TWD)</p>
                <p id="totalTwd" class="text-xl font-bold text-rose-600">NT$ 0</p>
            </div>
        </div>

        <!-- Quick Input Form -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
            <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                <h2 class="font-bold text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-amber-500"></i> 快速手動記帳
                </h2>
                <span class="text-xs text-gray-400">匯率: <span id="currentRateText">0.21</span></span>
            </div>
            
            <form id="recordForm" onsubmit="handleManualAdd(event)" class="space-y-3">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs text-gray-500">金額 (JPY) *</label>
                        <span id="calcPreview" class="text-xs text-rose-500 font-medium hidden">算式模式中</span>
                    </div>
                    <div class="relative">
                        <input type="text" id="inputAmount" placeholder="例: 1500 或 1500+100+50" required
                            oninput="handleAmountInput(this)"
                            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-base font-semibold focus:outline-none focus:border-rose-500 pr-10">
                        <button type="button" onclick="clearAmountInput()" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs px-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- Quick Add Nominal Buttons -->
                    <div class="flex gap-1.5 mt-2">
                        <button type="button" onclick="quickAddAmount(10)" class="flex-1 bg-gray-100 hover:bg-rose-50 hover:text-rose-600 text-gray-600 text-xs font-semibold py-1.5 rounded-md border border-gray-200 transition">
                            +10
                        </button>
                        <button type="button" onclick="quickAddAmount(100)" class="flex-1 bg-gray-100 hover:bg-rose-50 hover:text-rose-600 text-gray-600 text-xs font-semibold py-1.5 rounded-md border border-gray-200 transition">
                            +100
                        </button>
                        <button type="button" onclick="quickAddAmount(500)" class="flex-1 bg-gray-100 hover:bg-rose-50 hover:text-rose-600 text-gray-600 text-xs font-semibold py-1.5 rounded-md border border-gray-200 transition">
                            +500
                        </button>
                        <button type="button" onclick="quickAddAmount(1000)" class="flex-1 bg-gray-100 hover:bg-rose-50 hover:text-rose-600 text-gray-600 text-xs font-semibold py-1.5 rounded-md border border-gray-200 transition">
                            +1000
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">類別</label>
                        <select id="inputCategory" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500">
                            <option value="餐飲">🍜 餐飲</option>
                            <option value="購物">🛍️ 購物</option>
                            <option value="交通">🚃 交通</option>
                            <option value="住宿">🏨 住宿</option>
                            <option value="娛樂">🎡 娛樂</option>
                            <option value="其他">📦 其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">日期</label>
                        <input type="date" id="inputDate"
                            class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-500 mb-1">店家 / 項目</label>
                    <input type="text" id="inputMerchant" placeholder="例: 7-Eleven"
                        class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500">
                </div>

                <div>
                    <label class="block text-xs text-gray-500 mb-1">備註</label>
                    <input type="text" id="inputNote" placeholder="備註說明"
                        class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500">
                </div>

                <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium py-2.5 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> 新增紀錄
                </button>
            </form>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-3 text-xs text-gray-400">或使用 AI 辨識</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- AI Photo Receipt Upload Button -->
            <label class="w-full bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 font-medium py-2.5 rounded-lg shadow-sm transition flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-camera text-amber-600"></i> 拍照 / 上傳收據 AI 自動辨識
                <input type="file" id="receiptInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
            </label>
        </div>

        <!-- Export & Actions -->
        <div class="flex gap-2">
            <button onclick="copyToClipboardTSV()" class="flex-1 bg-white hover:bg-gray-50 border border-gray-200 text-gray-700 py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-copy text-green-600"></i> 複製到試算表
            </button>
            <button onclick="exportToCSV()" class="flex-1 bg-white hover:bg-gray-50 border border-gray-200 text-gray-700 py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-file-csv text-blue-600"></i> 下載 CSV 檔
            </button>
            <button onclick="clearAllData()" class="bg-white hover:bg-red-50 border border-gray-200 text-red-500 py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1 shadow-sm">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>

        <!-- Expense List -->
        <div class="space-y-2">
            <h2 class="font-bold text-gray-700 text-sm px-1">消費明細 (<span id="recordCount">0</span>)</h2>
            <div id="expenseList" class="space-y-2"></div>
        </div>

    </main>

    <!-- AI Loading Modal -->
    <div id="loadingModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 text-center space-y-4 max-w-xs w-full">
            <div class="inline-block animate-spin text-rose-600 text-4xl">
                <i class="fa-solid fa-circle-notch"></i>
            </div>
            <div>
                <h3 class="font-bold text-gray-800">Gemini AI 辨識中...</h3>
                <p class="text-xs text-gray-500 mt-1">正在讀取金額並翻譯日文品名為中文</p>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-5 space-y-4 max-w-sm w-full">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-gray-800">編輯記帳資料</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="editForm" onsubmit="handleEditSave(event)" class="space-y-3">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">金額 (JPY)</label>
                    <input type="text" id="editAmount" required class="w-full bg-gray-50 border rounded-lg px-3 py-2 text-base font-semibold">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">店家 / 項目</label>
                    <input type="text" id="editMerchant" class="w-full bg-gray-50 border rounded-lg px-3 py-2 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">類別</label>
                        <select id="editCategory" class="w-full bg-gray-50 border rounded-lg px-3 py-2 text-sm">
                            <option value="餐飲">🍜 餐飲</option>
                            <option value="購物">🛍️ 購物</option>
                            <option value="交通">🚃 交通</option>
                            <option value="住宿">🏨 住宿</option>
                            <option value="娛樂">🎡 娛樂</option>
                            <option value="其他">📦 其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">日期</label>
                        <input type="date" id="editDate" class="w-full bg-gray-50 border rounded-lg px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">備註 (含翻譯)</label>
                    <textarea id="editNote" rows="2" class="w-full bg-gray-50 border rounded-lg px-3 py-2 text-sm"></textarea>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="deleteCurrentEditRecord()" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg text-sm font-medium">刪除</button>
                    <button type="submit" class="flex-1 bg-rose-600 text-white py-2 rounded-lg text-sm font-medium">儲存變更</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-5 space-y-4 max-w-sm w-full">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-gray-800">設定與 API 設定</h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Gemini API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="貼上您的 Gemini API Key" class="w-full bg-gray-50 border rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">日圓匯率 (JPY -> TWD)</label>
                    <input type="number" step="0.001" id="rateInput" placeholder="0.21" class="w-full bg-gray-50 border rounded-lg px-3 py-2 text-sm">
                </div>
                <button onclick="saveSettings()" class="w-full bg-rose-600 text-white py-2 rounded-lg text-sm font-medium">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- Alert Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs py-2 px-4 rounded-full hidden z-50 transition-all shadow-lg"></div>

    <script>
        // State Management
        let records = [];
        try {
            records = JSON.parse(localStorage.getItem('japan_travel_records')) || [];
        } catch (err) {
            records = [];
        }
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let exchangeRate = parseFloat(localStorage.getItem('jpy_rate')) || 0.21;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('inputDate');
            if (dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
            }
            document.getElementById('apiKeyInput').value = apiKey;
            document.getElementById('rateInput').value = exchangeRate;
            document.getElementById('currentRateText').textContent = exchangeRate;
            renderList();
        });

        // Quick Nominal Addition Buttons
        function quickAddAmount(val) {
            const inputEl = document.getElementById('inputAmount');
            let currentVal = inputEl.value.trim();

            if (!currentVal) {
                inputEl.value = val;
            } else {
                if (/[+\-*\/]$/.test(currentVal)) {
                    inputEl.value = currentVal + val;
                } else {
                    inputEl.value = currentVal + '+' + val;
                }
            }
            handleAmountInput(inputEl);
        }

        function clearAmountInput() {
            const inputEl = document.getElementById('inputAmount');
            inputEl.value = '';
            document.getElementById('calcPreview').classList.add('hidden');
        }

        function handleAmountInput(inputEl) {
            const previewEl = document.getElementById('calcPreview');
            const val = inputEl.value.trim();

            if (val.includes('+') || val.includes('-') || val.includes('*') || val.includes('/')) {
                const evalResult = evaluateMath(val);
                if (evalResult !== null) {
                    previewEl.textContent = `= ¥${evalResult.toLocaleString()}`;
                    previewEl.classList.remove('hidden');
                } else {
                    previewEl.textContent = "算式輸入中...";
                    previewEl.classList.remove('hidden');
                }
            } else {
                previewEl.classList.add('hidden');
            }
        }

        // Safe Math Evaluation
        function evaluateMath(expression) {
            try {
                const sanitized = expression.replace(/[^0-9+\-*\/.]/g, '');
                if (!sanitized) return null;
                const result = Function('"use strict"; return (' + sanitized + ')')();
                return isNaN(result) || !isFinite(result) ? null : Math.round(result);
            } catch (err) {
                return null;
            }
        }

        // Save Settings
        function saveSettings() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            exchangeRate = parseFloat(document.getElementById('rateInput').value) || 0.21;
            
            localStorage.setItem('gemini_api_key', apiKey);
            localStorage.setItem('jpy_rate', exchangeRate);
            document.getElementById('currentRateText').textContent = exchangeRate;
            
            closeSettingsModal();
            renderList();
            showToast("設定已成功儲存");
        }

        // Render List & Update Summary
        function renderList() {
            const listEl = document.getElementById('expenseList');
            listEl.innerHTML = '';

            let totalJpy = 0;

            if (records.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-8 bg-white rounded-2xl border border-dashed border-gray-200">
                        <i class="fa-solid fa-receipt text-gray-300 text-3xl mb-2"></i>
                        <p class="text-xs text-gray-400">目前尚無記帳紀錄</p>
                    </div>`;
            } else {
                records.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(rec => {
                    totalJpy += Number(rec.amount);
                    const twdAmount = Math.round(rec.amount * exchangeRate);

                    const card = document.createElement('div');
                    card.className = "bg-white p-3.5 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center active:bg-gray-50 transition cursor-pointer";
                    card.onclick = () => openEditModal(rec.id);

                    card.innerHTML = `
                        <div class="space-y-1 pr-2">
                            <div class="flex items-center gap-2">
                                <span class="text-xs px-2 py-0.5 rounded-full bg-rose-50 text-rose-600 font-medium">${rec.category}</span>
                                <span class="font-bold text-gray-800 text-sm">${escapeHtml(rec.merchant || '未定店家')}</span>
                            </div>
                            ${rec.note ? `<p class="text-xs text-gray-500 leading-tight">${escapeHtml(rec.note)}</p>` : ''}
                            <p class="text-[10px] text-gray-400">${rec.date}</p>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <p class="font-bold text-gray-800 text-base">¥${Number(rec.amount).toLocaleString()}</p>
                            <p class="text-xs text-rose-500 font-medium">NT$ ${twdAmount.toLocaleString()}</p>
                        </div>
                    `;
                    listEl.appendChild(card);
                });
            }

            document.getElementById('totalJpy').textContent = `¥${totalJpy.toLocaleString()}`;
            document.getElementById('totalTwd').textContent = `NT$ ${Math.round(totalJpy * exchangeRate).toLocaleString()}`;
            document.getElementById('recordCount').textContent = records.length;

            localStorage.setItem('japan_travel_records', JSON.stringify(records));
        }

        // Handle Manual Entry Add
        function handleManualAdd(e) {
            e.preventDefault();
            const rawInput = document.getElementById('inputAmount').value.trim();
            const evaluatedAmount = evaluateMath(rawInput) || parseFloat(rawInput);

            if (!evaluatedAmount || evaluatedAmount <= 0) {
                showToast("請輸入有效的金額或算式");
                return;
            }

            const inputDateVal = document.getElementById('inputDate').value;
            const newRecord = {
                id: Date.now().toString(),
                amount: evaluatedAmount,
                category: document.getElementById('inputCategory').value,
                merchant: document.getElementById('inputMerchant').value || '未名店家',
                date: inputDateVal || new Date().toISOString().split('T')[0],
                note: document.getElementById('inputNote').value || ''
            };

            records.unshift(newRecord);
            renderList();

            clearAmountInput();
            document.getElementById('inputMerchant').value = '';
            document.getElementById('inputNote').value = '';
            showToast("成功新增一筆記帳！");
        }

        // Handle Image Upload & Gemini AI 3.8 Processing
        async function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!apiKey) {
                showToast("請先至右上角設定輸入 Gemini API Key");
                openSettingsModal();
                return;
            }

            document.getElementById('loadingModal').classList.remove('hidden');

            try {
                const base64Image = await convertFileToBase64(file);
                const result = await callGeminiAPI(base64Image);

                const newRecord = {
                    id: Date.now().toString(),
                    amount: result.amount || 0,
                    category: result.category || '購物',
                    merchant: result.merchant || '日本店家',
                    date: result.date || new Date().toISOString().split('T')[0],
                    note: result.translated_items || ''
                };

                records.unshift(newRecord);
                renderList();
                showToast("AI 辨識與翻譯成功！");
                openEditModal(newRecord.id);
            } catch (err) {
                alert("AI 解析失敗: " + err.message);
            } finally {
                document.getElementById('loadingModal').classList.add('hidden');
                e.target.value = '';
            }
        }

        // Call Gemini 3.8 Flash REST API
        async function callGeminiAPI(base64Data) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

            const prompt = `請解析這張日本收據/發票照片，並將結果輸出為 JSON 格式：
            {
                "date": "YYYY-MM-DD (若收據沒有寫年份請補齊今年)",
                "merchant": "店家名稱 (簡短繁體中文或日文原文)",
                "amount": 含稅總金額數字(純數字，如 1500),
                "category": "餐飲/購物/交通/住宿/娛樂/其他",
                "translated_items": "條列購買的主要商品或項目名稱，格式為：日文原文 (繁體中文翻譯) x數量，例如：おにぎり (飯糰) x1"
            }`;

            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        {
                            inline_data: {
                                mime_type: "image/jpeg",
                                data: base64Data
                            }
                        }
                    ]
                }],
                generationConfig: {
                    response_mime_type: "application/json"
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errJson = await response.json().catch(() => ({}));
                throw new Error(errJson.error?.message || `HTTP ${response.status}`);
            }

            const data = await response.json();
            const textResult = data.candidates[0].content.parts[0].text;
            return JSON.parse(textResult);
        }

        // Copy Records as TSV for direct Google Sheet Pasting
        function copyToClipboardTSV() {
            if (records.length === 0) {
                showToast("無資料可複製");
                return;
            }

            let tsv = "ID	日期	店家/項目	日圓金額(JPY)	估計台幣(TWD)	類別	中日文翻譯備註
";
            records.forEach(r => {
                const twd = Math.round(r.amount * exchangeRate);
                tsv += `${r.id}	${r.date}	${r.merchant}	${r.amount}	${twd}	${r.category}	${(r.note || '').replace(/
/g, ' ')}
`;
            });

            navigator.clipboard.writeText(tsv).then(() => {
                showToast("已複製！前往試算表第一格貼上即可");
            }).catch(() => {
                showToast("複製失敗，請手動匯出 CSV");
            });
        }

        // Export to CSV
        function exportToCSV() {
            if (records.length === 0) {
                showToast("無資料可匯出");
                return;
            }

            let csv = "﻿ID,日期,店家/項目,日圓金額(JPY),估計台幣(TWD),類別,備註
";
            records.forEach(r => {
                const twd = Math.round(r.amount * exchangeRate);
                const merchant = `"${(r.merchant || '').replace(/"/g, '""')}"`;
                const note = `"${(r.note || '').replace(/"/g, '""')}"`;
                csv += `${r.id},${r.date},${merchant},${r.amount},${twd},${r.category},${note}
`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Japan_Travel_Expenses_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // Edit Modal Handlers
        function openEditModal(id) {
            const rec = records.find(r => r.id === id);
            if (!rec) return;

            document.getElementById('editId').value = rec.id;
            document.getElementById('editAmount').value = rec.amount;
            document.getElementById('editMerchant').value = rec.merchant;
            document.getElementById('editCategory').value = rec.category;
            document.getElementById('editDate').value = rec.date;
            document.getElementById('editNote').value = rec.note || '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function handleEditSave(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const rawAmount = document.getElementById('editAmount').value.trim();
            const evaluatedAmount = evaluateMath(rawAmount) || parseFloat(rawAmount);

            const index = records.findIndex(r => r.id === id);

            if (index !== -1 && evaluatedAmount > 0) {
                records[index] = {
                    ...records[index],
                    amount: evaluatedAmount,
                    merchant: document.getElementById('editMerchant').value,
                    category: document.getElementById('editCategory').value,
                    date: document.getElementById('editDate').value,
                    note: document.getElementById('editNote').value
                };
                renderList();
                closeEditModal();
                showToast("紀錄修改成功！");
            }
        }

        function deleteCurrentEditRecord() {
            const id = document.getElementById('editId').value;
            if (confirm("確定要刪除這筆紀錄嗎？")) {
                records = records.filter(r => r.id !== id);
                renderList();
                closeEditModal();
                showToast("紀錄已刪除");
            }
        }

        function clearAllData() {
            if (confirm("確定要清空所有已記錄的消費資料嗎？")) {
                records = [];
                renderList();
                showToast("所有資料已清空");
            }
        }

        // Modals Toggle
        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

        // Utilities
        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
