<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本旅遊快速記帳助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .clear-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col">
        <!-- 頂部標題與設定 -->
        <header class="bg-red-600 text-white p-4 sticky top-0 z-10 shadow">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plane-departure"></i> 日本旅遊記帳
                </h1>
                <button id="toggleSettingsBtn" class="text-white hover:text-red-200">
                    <i class="fa-solid fa-gear text-xl"></i>
                </button>
            </div>
            
            <!-- 設定面板 -->
            <div id="settingsPanel" class="hidden mt-3 pt-3 border-t border-red-500/50 space-y-3">
                <div>
                    <label class="block text-xs text-red-100 mb-1">Gemini API Key (AI 辨識必填)</label>
                    <input type="password" id="apiKeyInput" placeholder="貼上 AI Studio API Key" 
                           class="w-full text-slate-800 px-3 py-1.5 rounded text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs text-red-100 mb-1">匯率設定 (1 JPY = ? TWD)</label>
                    <input type="number" step="0.001" id="exchangeRateInput" value="0.21" 
                           class="w-full text-slate-800 px-3 py-1.5 rounded text-sm outline-none">
                </div>
                <div class="text-xs text-red-100">Key 與匯率將安全儲存在本機瀏覽器。</div>
            </div>
        </header>

        <main class="p-4 space-y-4 flex-1">
            <!-- AI 收據辨識區 -->
            <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center gap-1">
                        <i class="fa-solid fa-wand-magic-sparkles text-purple-600"></i> AI 收據辨識 (Gemini 3 Flash)
                    </span>
                    <span id="aiStatus" class="text-xs text-slate-400"></span>
                </div>
                <div class="flex gap-2 items-center">
                    <input type="file" id="receiptImage" accept="image/*" class="hidden">
                    <button id="uploadBtn" class="flex-1 bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                        <i class="fa-solid fa-camera"></i> 選擇/拍攝收據照片
                    </button>
                </div>
                <div id="imagePreviewContainer" class="hidden mt-2 relative">
                    <img id="imagePreview" class="max-h-36 mx-auto rounded border border-slate-300">
                    <button id="clearImageBtn" class="absolute top-1 right-1 bg-slate-800/70 text-white rounded-full w-6 h-6 text-xs flex items-center justify-center">✕</button>
                </div>
            </div>

            <!-- 輸入表單區 -->
            <div class="bg-white rounded-lg border border-slate-200 p-4 space-y-3 shadow-sm">
                <!-- 金額輸入與快捷鍵 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-sm font-semibold text-slate-700">日幣金額 (JPY)</label>
                        <span id="twdPreview" class="text-xs font-medium text-emerald-600">≈ NT$ 0</span>
                    </div>
                    <div class="relative">
                        <input type="number" id="amountInput" placeholder="0" 
                               class="w-full text-2xl font-bold px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none text-right pr-8">
                        <button id="clearAmount" class="clear-btn text-slate-400 hover:text-slate-600 hidden">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>
                    <!-- 快捷加總按鈕 -->
                    <div class="grid grid-cols-4 gap-2 mt-2">
                        <button type="button" class="quick-add bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-1.5 rounded text-xs" data-val="100">+100</button>
                        <button type="button" class="quick-add bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-1.5 rounded text-xs" data-val="500">+500</button>
                        <button type="button" class="quick-add bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-1.5 rounded text-xs" data-val="1000">+1000</button>
                        <button type="button" class="quick-add bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-1.5 rounded text-xs" data-val="5000">+5000</button>
                    </div>
                </div>

                <!-- 品名 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">品名 / 店家</label>
                    <div class="relative">
                        <input type="text" id="itemNameInput" placeholder="例如：FamilyMart / 藥妝" 
                               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none pr-8 text-sm">
                        <button id="clearItemName" class="clear-btn text-slate-400 hover:text-slate-600 hidden">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>
                </div>

                <!-- 備註 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">備註 / 翻譯內容</label>
                    <div class="relative">
                        <textarea id="noteInput" rows="2" placeholder="詳細內容或AI翻譯備註" 
                                  class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none text-sm pr-8 resize-none"></textarea>
                        <button id="clearNote" class="clear-btn text-slate-400 hover:text-slate-600 hidden" style="top: 1.25rem;">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>
                </div>

                <button id="addRecordBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg shadow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> 新增此筆記帳
                </button>
            </div>

            <!-- 明細列表與匯出區 -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-list-check"></i> 記帳明細 
                        <span id="recordCount" class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">0</span>
                    </h2>
                    <button id="copyTsvBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded flex items-center gap-1 shadow">
                        <i class="fa-solid fa-copy"></i> 複製試算表格式 (TSV)
                    </button>
                </div>

                <div class="bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm">
                    <div class="max-h-80 overflow-y-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-500 text-xs border-b sticky top-0">
                                <tr>
                                    <th class="p-2">品名/備註</th>
                                    <th class="p-2 text-right">日幣</th>
                                    <th class="p-2 text-right">台幣</th>
                                    <th class="p-2 text-center w-8">刪</th>
                                </tr>
                            </thead>
                            <tbody id="recordList" class="divide-y divide-slate-100">
                                <!-- 動態渲染明細 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // State Management
        let records = JSON.parse(localStorage.getItem('japan_travel_records') || '[]');
        let rate = parseFloat(localStorage.getItem('jpy_twd_rate') || '0.21');
        let apiKey = localStorage.getItem('gemini_api_key') || '';

        // DOM Elements
        const apiKeyInput = document.getElementById('apiKeyInput');
        const exchangeRateInput = document.getElementById('exchangeRateInput');
        const settingsPanel = document.getElementById('settingsPanel');
        const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');

        const amountInput = document.getElementById('amountInput');
        const twdPreview = document.getElementById('twdPreview');
        const itemNameInput = document.getElementById('itemNameInput');
        const noteInput = document.getElementById('noteInput');

        const clearAmount = document.getElementById('clearAmount');
        const clearItemName = document.getElementById('clearItemName');
        const clearNote = document.getElementById('clearNote');

        const receiptImage = document.getElementById('receiptImage');
        const uploadBtn = document.getElementById('uploadBtn');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const clearImageBtn = document.getElementById('clearImageBtn');
        const aiStatus = document.getElementById('aiStatus');

        const addRecordBtn = document.getElementById('addRecordBtn');
        const recordList = document.getElementById('recordList');
        const recordCount = document.getElementById('recordCount');
        const copyTsvBtn = document.getElementById('copyTsvBtn');

        // Initial Setup
        apiKeyInput.value = apiKey;
        exchangeRateInput.value = rate;

        // Settings Toggle & Save
        toggleSettingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('hidden'));
        apiKeyInput.addEventListener('change', (e) => {
            apiKey = e.target.value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
        });
        exchangeRateInput.addEventListener('change', (e) => {
            rate = parseFloat(e.target.value) || 0.21;
            localStorage.setItem('jpy_twd_rate', rate);
            updateTwdPreview();
            renderRecords();
        });

        // Input Clears logic
        function setupClearBtn(input, btn) {
            input.addEventListener('input', () => {
                btn.classList.toggle('hidden', !input.value);
            });
            btn.addEventListener('click', () => {
                input.value = '';
                btn.classList.add('hidden');
                if (input === amountInput) updateTwdPreview();
            });
        }
        setupClearBtn(amountInput, clearAmount);
        setupClearBtn(itemNameInput, clearItemName);
        setupClearBtn(noteInput, clearNote);

        // Amount Calculations & Quick Add
        function updateTwdPreview() {
            const val = parseFloat(amountInput.value) || 0;
            twdPreview.textContent = `≈ NT$ ${Math.round(val * rate)}`;
        }

        amountInput.addEventListener('input', updateTwdPreview);

        document.querySelectorAll('.quick-add').forEach(btn => {
            btn.addEventListener('click', () => {
                const addVal = parseInt(btn.getAttribute('data-val'));
                const currentVal = parseInt(amountInput.value) || 0;
                amountInput.value = currentVal + addVal;
                clearAmount.classList.remove('hidden');
                updateTwdPreview();
            });
        });

        // AI Image Upload & Recognition
        uploadBtn.addEventListener('click', () => receiptImage.click());

        clearImageBtn.addEventListener('click', () => {
            receiptImage.value = '';
            imagePreviewContainer.classList.add('hidden');
            aiStatus.textContent = '';
        });

        receiptImage.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!apiKey) {
                alert('請先點擊右上角⚙️設定，貼上您的 Gemini API Key！');
                return;
            }

            // Show preview
            const reader = new FileReader();
            reader.onload = (evt) => {
                imagePreview.src = evt.target.result;
                imagePreviewContainer.classList.remove('hidden');
            };
            reader.readAsDataURL(file);

            // Clean previous AI state
            aiStatus.textContent = 'AI 辨識中...';
            aiStatus.className = 'text-xs text-purple-600 font-semibold animate-pulse';

            try {
                const base64Image = await fileToBase64(file);
                const result = await callGeminiVision(base64Image, apiKey);
                
                if (result) {
                    if (result.amount) {
                        amountInput.value = result.amount;
                        clearAmount.classList.remove('hidden');
                        updateTwdPreview();
                    }
                    if (result.storeName) {
                        itemNameInput.value = result.storeName;
                        clearItemName.classList.remove('hidden');
                    }
                    if (result.translatedItems) {
                        noteInput.value = result.translatedItems;
                        clearNote.classList.remove('hidden');
                    }
                    aiStatus.textContent = '辨識成功！';
                    aiStatus.className = 'text-xs text-emerald-600 font-semibold';
                }
            } catch (err) {
                console.error(err);
                aiStatus.textContent = '辨識失敗';
                aiStatus.className = 'text-xs text-red-600 font-semibold';
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function callGeminiVision(base64Data, key) {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${key}`;
            
            const prompt = `你是一個日本旅遊記帳助手。請分析這張收據照片，並回傳純JSON格式結果（不要有 markdown codeblock 包裹）：
            {
                "amount": 總金額數字(整數日圓, 若辨識不到填 0),
                "storeName": "店家名稱或主要商品類別",
                "translatedItems": "將主要購買的商品翻譯為繁體中文，格式為：品項1 (日幣金額), 品項2..."
            }`;

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            const textResp = data.candidates[0].content.parts[0].text;
            const cleanJson = textResp.replace(/```json/g, '').replace(/```/g, '').trim();
            return JSON.parse(cleanJson);
        }

        // Record Management
        addRecordBtn.addEventListener('click', () => {
            const jpy = parseInt(amountInput.value) || 0;
            const item = itemNameInput.value.trim() || '未命名消費';
            const note = noteInput.value.trim();

            if (jpy <= 0 && !confirm('確定新增金額為 0 的紀錄嗎？')) return;

            const newRecord = {
                id: Date.now(),
                date: new Date().toLocaleDateString('zh-TW'),
                time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }),
                item: item,
                jpy: jpy,
                twd: Math.round(jpy * rate),
                note: note
            };

            records.unshift(newRecord);
            saveAndRender();

            // Reset inputs
            amountInput.value = '';
            itemNameInput.value = '';
            noteInput.value = '';
            clearAmount.classList.add('hidden');
            clearItemName.classList.add('hidden');
            clearNote.classList.add('hidden');
            updateTwdPreview();
        });

        function saveAndRender() {
            localStorage.setItem('japan_travel_records', JSON.stringify(records));
            renderRecords();
        }

        function renderRecords() {
            recordCount.textContent = records.length;
            recordList.innerHTML = '';

            records.forEach((rec, idx) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 border-b border-slate-100 text-xs';
                tr.innerHTML = `
                    <td class="p-2">
                        <div contenteditable="true" class="edit-item font-semibold text-slate-800 outline-none" data-idx="${idx}">${rec.item}</div>
                        <div contenteditable="true" class="edit-note text-slate-400 text-[10px] outline-none" data-idx="${idx}">${rec.note || '點擊新增備註'}</div>
                    </td>
                    <td class="p-2 text-right">
                        ¥ <span contenteditable="true" class="edit-jpy font-medium text-slate-700 outline-none" data-idx="${idx}">${rec.jpy}</span>
                    </td>
                    <td class="p-2 text-right">
                        $ <span contenteditable="true" class="edit-twd font-medium text-emerald-600 outline-none" data-idx="${idx}">${rec.twd}</span>
                    </td>
                    <td class="p-2 text-center">
                        <button class="delete-btn text-slate-300 hover:text-red-500" data-idx="${idx}">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                recordList.appendChild(tr);
            });

            // Bind inline edit events
            document.querySelectorAll('.edit-item').forEach(el => {
                el.addEventListener('blur', (e) => {
                    const idx = e.target.dataset.idx;
                    records[idx].item = e.target.textContent.trim();
                    saveAndRender();
                });
            });

            document.querySelectorAll('.edit-note').forEach(el => {
                el.addEventListener('blur', (e) => {
                    const idx = e.target.dataset.idx;
                    const val = e.target.textContent.trim();
                    records[idx].note = val === '點擊新增備註' ? '' : val;
                    saveAndRender();
                });
            });

            document.querySelectorAll('.edit-jpy').forEach(el => {
                el.addEventListener('blur', (e) => {
                    const idx = e.target.dataset.idx;
                    const jpyVal = parseInt(e.target.textContent) || 0;
                    records[idx].jpy = jpyVal;
                    records[idx].twd = Math.round(jpyVal * rate);
                    saveAndRender();
                });
            });

            document.querySelectorAll('.edit-twd').forEach(el => {
                el.addEventListener('blur', (e) => {
                    const idx = e.target.dataset.idx;
                    const twdVal = parseInt(e.target.textContent) || 0;
                    records[idx].twd = twdVal;
                    records[idx].jpy = Math.round(twdVal / rate);
                    saveAndRender();
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = btn.dataset.idx;
                    records.splice(idx, 1);
                    saveAndRender();
                });
            });
        }

        // Copy TSV Format for Google Sheets / Excel
        copyTsvBtn.addEventListener('click', () => {
            if (records.length === 0) {
                alert('目前無紀錄可複製！');
                return;
            }

            let tsv = '日期\t時間\t品名/店家\t日幣金額(JPY)\t台幣金額(TWD)\t備註/翻譯\n';
            records.forEach(r => {
                tsv += `${r.date}\t${r.time}\t${r.item}\t${r.jpy}\t${r.twd}\t${r.note || ''}\n`;
            });

            navigator.clipboard.writeText(tsv).then(() => {
                const originalText = copyTsvBtn.innerHTML;
                copyTsvBtn.innerHTML = `<i class="fa-solid fa-check"></i> 已複製完成！`;
                copyTsvBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
                setTimeout(() => {
                    copyTsvBtn.innerHTML = originalText;
                    copyTsvBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                }, 2000);
            });
        });

        // Initial Render
        renderRecords();
    </script>
</body>
</html>
